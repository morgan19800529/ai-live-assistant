<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 直播助手 · 输入表单原型 v0.1</title>
<style>
  :root{--bg:#0f1216;--card:#171b21;--line:#2a313a;--txt:#e6e9ee;--dim:#9aa4b2;--acc:#4f9cff;--ok:#33c27f}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
  .wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
  input,select,textarea{width:100%;background:#0f1319;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 12px;font-size:15px;font-family:inherit}
  textarea{min-height:60px;resize:vertical}
  .row{display:flex;gap:12px}.row>div{flex:1}
  button{width:100%;margin-top:18px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
  button:active{transform:translateY(1px)}
  .out{white-space:pre-wrap;background:#0f1319;border:1px solid var(--line);border-radius:9px;padding:14px;font-size:13px;max-height:340px;overflow:auto;margin-top:12px}
  .copy{background:var(--ok)}
  .note{font-size:12px;color:var(--dim);margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .hint{font-size:12px;color:var(--dim);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 直播助手 · 输入表单原型</h1>
  <p class="sub">Morgan AI Studio · V2 · v0.1 —— 填字段，一键生成可直接粘给 AI 的直播稿 Prompt。纯本机运行，不上传、不存密钥。</p>

  <div class="card">
    <label>主题 *</label>
    <input id="topic" placeholder="例如：45岁开始做自媒体的3个真相">
    <div class="row">
      <div><label>时长</label><input id="dur" value="6分钟"></div>
      <div><label>平台</label>
        <select id="plat">
          <option>视频号</option><option>抖音</option><option>YouTube</option><option>小红书直播</option>
        </select>
      </div>
    </div>
    <label>受众</label>
    <input id="aud" placeholder="例如：35~50岁、想做副业但没方向的普通人">
    <label>目标 CTA</label>
    <input id="cta" placeholder="例如：关注账号 + 评论区扣“1”领清单">
    <label>风格</label>
    <input id="style" placeholder="例如：真诚、接地气、偶尔自嘲">
    <button onclick="gen()">生成 Prompt</button>
  </div>

  <div class="card" id="outcard" style="display:none">
    <label>把下面全部复制，粘给任意 AI（ChatGPT / Claude / 豆包 / Kimi 均可）</label>
    <div class="out" id="out"></div>
    <button class="copy" onclick="copy()">一键复制</button>
    <p class="note">生成后：让 AI 出稿 → 人工删掉不像你说话的句子、核对例子真实 → TXT/Markdown 导入「镜头说」提词器开播 → 直播后把留人点效果记进复盘。</p>
  </div>
</div>

<script>
var SYS = [
"你是一名资深中文直播编导，服务于普通创作者。你的任务：把用户给的主题，写成一篇可以直接照着念的直播口播稿。",
"",
"硬性要求：",
"1. 口语化。像和朋友聊天，不用书面语，不用“综上所述/首先其次”这类词。",
"2. 提词器友好。每句话独立成行，一句不超过 25 个字；不要用 Markdown 符号（#、*、- 等），不要加粗。",
"3. 留人设计。每 60~90 秒插入一个“留人节点”，用【留人】标注（如抛问题、预告后面干货、制造悬念、喊互动）。这些标注单独成行。",
"4. 结构：开场钩子(15 秒内抓住人) → 价值主体(3~5 个要点，每点一个小故事或例子) → 高潮/干货集中 → 行动号叨(CTA) → 收尾预告下一场。",
"5. 真实可信。不编造数据和名人语录；举例用“比如””我自己”这类第一人称经验。",
"6. 节奏标注。在需要停顿、加重、看镜头的地方，用（停顿）（看镜头）（放慢）单独成行提示。",
"",
"输出只给稿子本身，从开场第一句开始，不要前言。"
].join("\n");

function v(id){return (document.getElementById(id).value||"").trim();}
function gen(){
  var topic=v("topic");
  if(!topic){alert("请先填主题");return;}
  var inputs=[
    "主题："+topic,
    "时长："+(v("dur")||"6分钟"),
    "平台："+v("plat"),
    "受众："+(v("aud")||"（未填，请按大众设定）"),
    "目标CTA："+(v("cta")||"关注 + 评论区互动"),
    "风格："+(v("style")||"真诚、接地气")
  ].join("\n");
  var full=SYS+"\n\n以下是本次输入：\n"+inputs;
  document.getElementById("out").textContent=full;
  document.getElementById("outcard").style.display="block";
  document.getElementById("outcard").scrollIntoView({behavior:"smooth"});
}
function copy(){
  var t=document.getElementById("out").textContent;
  navigator.clipboard.writeText(t).then(function(){
    var b=event.target;b.textContent="已复制 ✓";setTimeout(function(){b.textContent="一键复制";},1500);
  },function(){
    var r=document.createRange();r.selectNodeContents(document.getElementById("out"));
    var s=getSelection();s.removeAllRanges();s.addRange(r);
    alert("已选中，请按 Ctrl/Cmd+C 复制");
  });
}
</script>
</body>
</html>
